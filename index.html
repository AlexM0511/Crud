<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Gestión de Actividades</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body class="bg-light">

<div class="container py-5">
  <div class="row justify-content-center">
    <div class="col-lg-8">

      <div class="card shadow mb-4">
        <div class="card-body">
          <h2 class="text-center mb-4">Inscripción a Actividades</h2>

          <form id="formActividad">

            <div class="mb-3">
              <label class="form-label">Nombre</label>
              <input type="text" id="nombre" class="form-control" required>
            </div>

            <div class="mb-3">
              <label class="form-label">Actividad</label>
              <select id="actividad" class="form-select" required></select>
            </div>

            <div class="mb-3">
              <label class="form-label d-block">Turno</label>

              <input type="radio" class="btn-check" name="turno" id="manana" value="Mañana" required>
              <label class="btn btn-outline-primary me-2" for="manana">Mañana</label>

              <input type="radio" class="btn-check" name="turno" id="tarde" value="Tarde">
              <label class="btn btn-outline-primary" for="tarde">Tarde</label>
            </div>

            <button class="btn btn-success w-100" type="submit">
              Guardar Inscripción
            </button>

          </form>
        </div>
      </div>

      <div class="card shadow">
        <div class="card-body">
          <h4 class="mb-3">Inscripciones Registradas</h4>

          <div class="table-responsive">
            <table class="table table-bordered table-hover text-center align-middle">
              <thead class="table-dark">
                <tr>
                  <th>Nombre</th>
                  <th>Actividad</th>
                  <th>Turno</th>
                  <th>Acciones</th>
                </tr>
              </thead>
              <tbody id="tablaInscripciones"></tbody>
            </table>
          </div>

        </div>
      </div>

    </div>
  </div>
</div>

<script src="apps.js"></script>
</body>
</html>
